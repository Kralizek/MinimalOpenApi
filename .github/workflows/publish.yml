name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: minor
        type: choice
        options:
          - major
          - minor
          - patch
      release_channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - alpha
          - beta
          - rc
      dry_run:
        description: Validate the selected release without publishing packages or creating a release
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  packages: write
  contents: write
  id-token: write

jobs:
  release:
    name: Validate, pack, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Validate release source
        if: github.ref != 'refs/heads/master'
        run: |
          echo "Releases must be dispatched from master."
          exit 1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate release version
        id: version
        uses: Kralizek/github-actions/actions/calculate-next-version@v0.4
        with:
          bump: ${{ inputs.bump }}
          channel: ${{ inputs.release_channel != 'stable' && inputs.release_channel || '' }}
          minimum-version: 1.0.0

      - name: Build and test
        uses: Kralizek/github-actions/actions/dotnet-build@v0.4
        env:
          MinVerVersionOverride: ${{ steps.version.outputs.version }}
        with:
          checkout: false
          global_json_file: ''
          dotnet_version: '10.0.x'
          test_arguments: ''

      - name: Pack
        env:
          MinVerVersionOverride: ${{ steps.version.outputs.version }}
        run: |
          dotnet pack src/MinimalOpenAPI/MinimalOpenAPI.csproj \
            --no-build \
            --configuration Release \
            --output ./artifacts

      - name: Validate package contents
        run: bash scripts/validate-package.sh ./artifacts

      - name: Restore package-consumption smoke test
        run: >-
          dotnet restore sample/SmokeTest/SmokeTest.csproj
          --force
          --no-cache
          --configfile sample/SmokeTest/nuget.config

      - name: Build package-consumption smoke test
        run: |
          dotnet build sample/SmokeTest/SmokeTest.csproj \
            --no-restore \
            --configuration Release \
            --warnaserror

      - name: Publish package-consumption smoke test
        run: |
          dotnet publish sample/SmokeTest/SmokeTest.csproj \
            --no-restore \
            --configuration Release \
            --output /tmp/minimalopenapi-smoke

      - name: Verify authored schema in publish output
        run: |
          find /tmp/minimalopenapi-smoke/openapi/schemas -name 'openapi.yaml' \
            | grep -q .

      - name: Upload packages as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          if-no-files-found: error

      - name: Dry-run release summary
        if: inputs.dry_run
        run: |
          echo "Dry run: no packages or GitHub release will be published."
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Version bump: ${{ inputs.bump }}"
          echo "Release channel: ${{ inputs.release_channel }}"
          echo "Release notes start tag: ${{ steps.version.outputs['release-notes-start-tag'] }}"

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NOTES_START_TAG: ${{ steps.version.outputs['release-notes-start-tag'] }}
        run: |
          set -euo pipefail
          git tag "$TAG" HEAD
          git push origin "$TAG"

          args=("$TAG" --verify-tag --generate-notes --title "$TAG")
          if [[ "${{ inputs.release_channel }}" != "stable" ]]; then
            args+=(--prerelease)
          fi
          if [[ -n "$RELEASE_NOTES_START_TAG" ]]; then
            args+=(--notes-start-tag "$RELEASE_NOTES_START_TAG")
          fi
          gh release create "${args[@]}"

      - name: Configure GitHub Packages source
        if: ${{ !inputs.dry_run }}
        run: >-
          dotnet nuget add source
          "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --name github
          --username "${{ github.actor }}"
          --password "${{ github.token }}"
          --store-password-in-clear-text

      - name: Push to GitHub Packages
        if: ${{ !inputs.dry_run }}
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --source github \
            --api-key "${{ github.token }}" \
            --skip-duplicate

      - name: Upload packages to GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            ./artifacts/*.nupkg \
            ./artifacts/*.snupkg \
            --repo "${{ github.repository }}"

      - name: NuGet login
        if: ${{ !inputs.dry_run }}
        id: nuget-login
        uses: nuget/login@v1
        with:
          user: Kralizek

      - name: Push to NuGet.org
        if: ${{ !inputs.dry_run }}
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
