name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout for consumer skill validation
        uses: actions/checkout@v6

      - name: Check consumer agent skill and references
        run: python3 scripts/check-consumer-skill.py

      - name: Build and test
        uses: Kralizek/github-actions/actions/dotnet-build@v0.4
        with:
          global_json_file: ''
          dotnet_version: '10.0.x'
          fetch_depth: 0
          test_arguments: ''

      - name: Pack
        run: dotnet pack src/MinimalOpenAPI/MinimalOpenAPI.csproj --no-build --configuration Release
