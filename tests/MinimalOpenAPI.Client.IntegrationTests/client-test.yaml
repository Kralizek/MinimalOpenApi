openapi: 3.0.3
info:
  title: Client test API
  version: 1.0.0
paths:
  /accounts:
    post:
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountEnvelope'}
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountEnvelope'}
  /wire/{day}:
    get:
      operationId: getWire
      parameters:
        - name: day
          in: path
          required: true
          schema: {type: string, format: date}
        - name: at
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: tags
          in: query
          required: true
          schema: {$ref: '#/components/schemas/Tags'}
        - name: 'a&b'
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Nullable value
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NullableValue'}
  /count:
    get:
      operationId: getCount
      responses:
        '200':
          description: Count
          content:
            application/json:
              schema:
                type: integer
  /nullable-count:
    get:
      operationId: getNullableCount
      responses:
        '200':
          description: Nullable count
          content:
            application/json:
              schema:
                type: integer
                nullable: true
  /todos/{id}:
    get:
      operationId: getTodo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: includeDetails
          in: query
          required: false
          schema:
            type: boolean
        - name: labels
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [fast-mode, fast_mode, safe]
        - name: x-trace
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '404':
          description: Missing
    delete:
      operationId: deleteTodo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
  /todos:
    post:
      operationId: createTodo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, details]
              properties:
                title:
                  type: string
                details:
                  type: object
                  required: [priority]
                  properties:
                    priority:
                      type: integer
                    note:
                      type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
  /preview:
    post:
      operationId: previewTodo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [details]
              properties:
                details:
                  type: object
                  required: [source]
                  properties:
                    source:
                      type: string
      responses:
        '200':
          description: Preview
          content:
            application/json:
              schema:
                type: object
                required: [details]
                properties:
                  details:
                    type: object
                    required: [score]
                    properties:
                      score:
                        type: number
  /fingerprint-a:
    get:
      operationId: getFingerprintA
      responses:
        '200':
          description: First shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fingerprint-Test'
  /fingerprint-b:
    get:
      operationId: getFingerprintB
      responses:
        '200':
          description: Second shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fingerprint_Test'
  /optional-body:
    post:
      operationId: optionalBody
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
      responses:
        '204':
          description: Accepted without a response body
  /nullable-array:
    get:
      operationId: nullableArray
      parameters:
        - name: tags
          in: query
          required: true
          schema:
            type: array
            nullable: true
            items:
              type: string
      responses:
        '204':
          description: Accepted without a response body
  /collision-one:
    get:
      operationId: get-user
      responses:
        '204':
          description: First normalized operation name
  /collision-two:
    get:
      operationId: get_user
      responses:
        '204':
          description: Second normalized operation name
  /parameter-collision:
    post:
      operationId: parameterCollision
      parameters:
        - name: body
          in: query
          required: false
          schema:
            type: string
        - name: cancellationToken
          in: query
          required: false
          schema:
            type: string
        - name: class
          in: query
          schema:
            type: string
        - name: path
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
      responses:
        '204':
          description: Accepted
  /parameter-override/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: parameterOverride
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Operation-level parameter overrides path-level parameter
components:
  schemas:
    AccountEnvelope:
      type: object
      required: [account]
      properties:
        account: {$ref: '#/components/schemas/Account'}
    Account:
      type: object
      required: [id, password, name]
      properties:
        id: {type: integer, readOnly: true}
        password: {type: string, writeOnly: true}
        name: {type: string, nullable: true}
        parent: {$ref: '#/components/schemas/Account'}
    Tags:
      type: array
      nullable: true
      items: {type: string}
    NullableValue:
      type: string
      nullable: true
    NameCollision:
      type: object
      additionalProperties: true
      properties:
        nameCollision:
          type: string
        additionalProperties:
          type: string
    HttpClient:
      type: object
      properties:
        value:
          type: string
    WireValue:
      type: string
      enum: [WireValue, "line\nbreak"]
    Todo:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        completed:
          type: boolean
    Fingerprint-Test:
      type: object
      required: [value]
      properties:
        value:
          type: string
    Fingerprint_Test:
      type: object
      additionalProperties: true
      properties:
        value:
          type: string
    ClientTestClient:
      type: object
      properties:
        value:
          type: string
    ClientTestClientException:
      type: object
      properties:
        value:
          type: string
    ClientTestClientServiceCollectionExtensions:
      type: object
      properties:
        value:
          type: string
