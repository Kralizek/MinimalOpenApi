openapi: "3.0.3"
info:
  title: Catalog API
  version: "1.0.0"
paths:
  /catalog/items/{id}:
    get:
      operationId: getCatalogItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int32 } }
      responses:
        "200":
          description: The catalog item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogItem' }
        "404":
          description: Not found.
components:
  schemas:
    CatalogItem:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int32 }
        name: { type: string }
